<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargar envio</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #c8972e;
      --primary-strong: #b8851f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(200, 151, 46, 0.16), transparent 45%),
        linear-gradient(180deg, #f9f7f2 0%, var(--bg) 100%);
      padding: 22px;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 36px rgba(17, 24, 39, 0.09);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    .meta {
      margin-top: 8px;
      margin-bottom: 18px;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.45;
    }

    .meta strong {
      color: #111827;
      font-size: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(200, 151, 46, 0.2);
    }

    .hint {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .01em;
      cursor: pointer;
      transition: transform .12s ease, opacity .12s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #fff;
    }

    .secondary {
      background: #eceff3;
      color: #111827;
    }

    .errorlist {
      margin: 0 0 10px;
      padding: 0;
      list-style: none;
      color: #b91c1c;
      font-size: 12px;
      font-weight: 600;
    }

    @media (max-width: 680px) {
      body { padding: 14px; }
      .wrap { padding: 18px; border-radius: 12px; }
      h1 { font-size: 19px; }
      .actions button { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Cargar envio</h1>
    <div class="meta">
      Orden <strong>#{{ order.order_code }}</strong> - {{ order.customer_name }}
    </div>

    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label for="id_tracking_code">{{ form.tracking_code.label }}</label>
      {{ form.tracking_code.errors }}
      {{ form.tracking_code }}
      <div class="hint">Al guardar, la orden pasa automaticamente de Pendiente a Enviado.</div>

      <div class="actions">
        <button type="submit" class="primary">Guardar envio</button>
        <button type="button" class="secondary" onclick="window.close()">Cancelar</button>
      </div>
    </form>
  </div>
</body>
</html>
