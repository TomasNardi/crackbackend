<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargar envio</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f7fb; color: #1f2937; }
    .wrap { max-width: 520px; margin: 20px auto; background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .meta { font-size: 13px; color: #4b5563; margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    input[type="text"] { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    .hint { margin-top: 8px; font-size: 12px; color: #6b7280; }
    .actions { margin-top: 18px; display: flex; gap: 10px; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .primary { background: #2563eb; color: #fff; }
    .secondary { background: #e5e7eb; color: #111827; }
    .errorlist { margin: 0 0 10px; padding: 0; list-style: none; color: #b91c1c; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Cargar envio</h1>
    <div class="meta">
      Orden <strong>#{{ order.order_code }}</strong> - {{ order.customer_name }}
    </div>

    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label for="id_tracking_code">{{ form.tracking_code.label }}</label>
      {{ form.tracking_code.errors }}
      {{ form.tracking_code }}
      <div class="hint">Al guardar, la orden pasa automaticamente de Pendiente a Enviado.</div>

      <div class="actions">
        <button type="submit" class="primary">Guardar envio</button>
        <button type="button" class="secondary" onclick="window.close()">Cancelar</button>
      </div>
    </form>
  </div>
</body>
</html>
